serenity {
  project.name = "SauceDemo - Automatización con Serenity BDD Screenplay"
  take.screenshots = AFTER_EACH_STEP
  test.root = "co.com.saucedemo"
  logging = VERBOSE
}

headless.mode = false

webdriver {
  driver = chrome
  # Serenity descarga y configura automáticamente el driver compatible con el Chrome instalado
  autodownload = true
  wait.for.timeout = 10000
  timeouts.implicitlywait = 5000

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "incognito", "disable-infobars", "disable-extensions",
              "disable-popup-blocking", "disable-gpu", "remote-allow-origins=*",
              "disable-features=PasswordLeakDetection"]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
        "profile.password_manager_leak_detection" = false
      }
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
  }
  all {
    pagina.inicio.sesion = "#{webdriver.base.url}/"
  }
}
